services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      LMS_APP_DB_PASSWORD: ${LMS_APP_DB_PASSWORD:-app_sec_pwd_9a8b7c6d5e4f3a2b1c}
      LMS_PLATFORM_DB_PASSWORD: ${LMS_PLATFORM_DB_PASSWORD:-platform_sec_pwd_1a2b3c4d5e6f7a8b9c}
    ports:
      # Hanya diekspos ke localhost untuk keamanan
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
